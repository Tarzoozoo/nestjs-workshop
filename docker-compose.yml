services:
  nest-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nest-app
    container_name: nest-app
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres-101

  postgres-101:
    image: postgres:latest
    container_name: postgres-101
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  postgres_data: